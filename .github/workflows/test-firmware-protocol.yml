name: Firmware Protocol Tests

on:
  push:
    paths:
      - "firmware/Libraries/BajolsProtocol/**"
      - "firmware/tests/bcp/**"
      - "firmware/tools/**"
      - "protocol/**"
      - ".github/workflows/test-firmware-protocol.yml"
  pull_request:
    paths:
      - "firmware/Libraries/BajolsProtocol/**"
      - "firmware/tests/bcp/**"
      - "firmware/tools/**"
      - "protocol/**"
      - ".github/workflows/test-firmware-protocol.yml"
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol, session, serial and storage power-loss tests
        run: python3 firmware/tests/bcp/run_native_tests.py
      - name: Address and undefined-behavior sanitizers
        run: python3 firmware/tests/bcp/run_native_tests.py --sanitize
