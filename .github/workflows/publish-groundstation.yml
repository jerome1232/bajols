name: Publish Ground Station

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      display: ${{ steps.version.outputs.display }}
      linux: ${{ steps.version.outputs.linux }}
    steps:
      - id: version
        shell: bash
        run: |
          suffix="dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          {
            echo "display=0.0.0-$suffix"
            echo "linux=0.0.0~$suffix"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: groundstation
    env:
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
      LINUX_VERSION: ${{ needs.version.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check locked project dependencies
        run: dotnet restore Bajols.GroundStation.slnx --locked-mode
      - name: Publish self-contained app
        run: >-
          dotnet publish Bajols.GroundStation --configuration Release
          --runtime ${{ matrix.rid }} --self-contained true
          --output package-publish
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path package-publish/Bajols.GroundStation.exe)) {
            throw "The published application is missing."
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          & $compiler "/DAppVersion=$env:DISPLAY_VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install RPM build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Debian and RPM packages
        if: runner.os == 'Linux'
        run: bash packaging/linux.sh package-publish packages "$LINUX_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: groundstation-${{ matrix.rid }}-${{ env.DISPLAY_VERSION }}
          path: |
            groundstation/packages/*.exe
            groundstation/packages/*.deb
            groundstation/packages/*.rpm
          if-no-files-found: error
