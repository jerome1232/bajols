name: Compile Sketches

# See: https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows
on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/compile-sketches.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/compile-sketches.yml"
  schedule:
    # Run every Tuesday at 8 AM UTC to catch breakage caused by changes to external resources (libraries, platforms).
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    name: ${{ matrix.board.fqbn }}
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false

      matrix:
        board:
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
            artifact-name-suffix: arduino-avr-mega

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile sketches
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: firmware/Libraries/BajolsProtocol
            - source-url: https://github.com/bmellink/IBusBM.git
              version: v1.1.4
            - name: Servo
              version: 1.3.0
            - name: Encoder
              version: 1.4.4
            - name: Adafruit BusIO
              version: 1.17.4
            - name: Adafruit PWM Servo Driver Library
              version: 3.0.2

          sketch-paths: |
            - firmware/Experimental/TelemetryProof
            - firmware/Experimental/BcpCodecCheck
            - firmware/Experimental/BcpSessionCheck
            - firmware/Experimental/BcpSerialCheck
            - firmware/Experimental/BcpStorageCheck
            - firmware/Experimental/BcpEepromCheck
            - firmware/Experimental/BcpMonitor
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save sketches report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: sketches-report-${{ matrix.board.artifact-name-suffix }}
